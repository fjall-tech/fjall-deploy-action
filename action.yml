name: "Fjall Deploy"
description: "Deploy, destroy, or build Fjall applications on AWS"
branding:
  icon: "cloud"
  color: "gray-dark"

inputs:
  command:
    description: "Command to run: deploy, destroy, or build"
    required: false
    default: "deploy"
  target:
    description: "Target: app name, organisation, platform, or account (app name for build)"
    required: true
  service:
    description: "Specific service name (deploy and build only)"
    required: false
    default: ""
  mode:
    description: "Deploy mode: full, infra-only, or deploy-only (deploy only)"
    required: false
    default: "full"
  environment:
    description: "Target environment (maps to the -e flag; deploy only)"
    required: false
    default: ""
  verbose:
    description: "Enable verbose output (-v)"
    required: false
    default: "false"
  skip-build:
    description: "Skip Docker build — use with mode: deploy-only when the image is already pushed (deploy only)"
    required: false
    default: "false"
  skip-migrations:
    description: "Skip database migrations during this deployment (deploy only)"
    required: false
    default: "false"
  no-cascade:
    description: "Skip automatic platform/account cascade around organisation deploys and destroys"
    required: false
    default: "false"
  region:
    description: "Deploy to a specific region within the target's account (deploy only)"
    required: false
    default: ""
  image-tag:
    description: "Roll forward/back to an existing image tag — skips build, implies deploy-only (deploy only)"
    required: false
    default: ""
  plan:
    description: "Compute and print the change plan, then stop before any mutation. Exit 0 = no changes, 2 = changes pending approval, 1 = error (deploy only)"
    required: false
    default: "false"
  require-approval:
    description: "Engage the approval gate: refuse to mutate unless the plan is approved via auto-approve or a prior approval-token (deploy only)"
    required: false
    default: "false"
  auto-approve:
    description: "Approve the computed plan without prompting — use with require-approval to proceed past changes in CI (deploy only)"
    required: false
    default: "false"
  approval-token:
    description: "Resume an approved plan from a prior plan run; the plan digest is re-verified before applying (deploy only)"
    required: false
    default: ""
  build-args:
    description: "Public build-time args as newline-separated KEY=VALUE pairs, each passed via --build-arg (deploy and build)"
    required: false
    default: ""
  build-secrets:
    description: "Ad-hoc build secret refs as newline-separated id=ID,ssm=PATH (or secretsManager=NAME | env=VAR) tokens, each passed via --build-secret (deploy and build)"
    required: false
    default: ""
  force:
    description: "Deploy: redeploy all stacks even when no changes are detected. Destroy: skip destruction confirmation"
    required: false
    default: "false"
  cli-version:
    description: "Pin the published fjall CLI version (default: latest)"
    required: false
    default: "latest"
  working-directory:
    description: "Directory containing fjall-config.json"
    required: false
    default: "."

outputs:
  result:
    description: "Command result: success, plan-pending (exit code 2 — changes pending approval or rejected at the gate), or failure"
    value: ${{ steps.run.outputs.result }}
  duration:
    description: "Command duration in seconds"
    value: ${{ steps.run.outputs.duration }}
  approval-token:
    description: "Approval token emitted by a plan run with pending changes; feed it back via the approval-token input to apply"
    value: ${{ steps.run.outputs.approval-token }}

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Install Fjall CLI
      shell: bash
      env:
        CLI_VERSION: ${{ inputs.cli-version }}
      run: |
        if [ "${CLI_VERSION}" = "latest" ]; then
          npm install -g fjall
        else
          npm install -g "fjall@${CLI_VERSION}"
        fi
        echo "Installed $(fjall --version)"

    - name: Run Fjall
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_SERVICE: ${{ inputs.service }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
        INPUT_SKIP_BUILD: ${{ inputs.skip-build }}
        INPUT_SKIP_MIGRATIONS: ${{ inputs.skip-migrations }}
        INPUT_NO_CASCADE: ${{ inputs.no-cascade }}
        INPUT_REGION: ${{ inputs.region }}
        INPUT_IMAGE_TAG: ${{ inputs.image-tag }}
        INPUT_PLAN: ${{ inputs.plan }}
        INPUT_REQUIRE_APPROVAL: ${{ inputs.require-approval }}
        INPUT_AUTO_APPROVE: ${{ inputs.auto-approve }}
        INPUT_APPROVAL_TOKEN: ${{ inputs.approval-token }}
        INPUT_BUILD_ARGS: ${{ inputs.build-args }}
        INPUT_BUILD_SECRETS: ${{ inputs.build-secrets }}
        INPUT_FORCE: ${{ inputs.force }}
      run: |
        case "${INPUT_COMMAND}" in
          deploy|destroy|build) ;;
          *)
            echo "Error: unsupported command '${INPUT_COMMAND}' (expected deploy, destroy, or build)" >&2
            exit 1
            ;;
        esac

        # Mode only applies to deploy — reject a non-default mode elsewhere
        if [ "${INPUT_COMMAND}" != "deploy" ] && [ "${INPUT_MODE}" != "full" ]; then
          echo "Error: 'mode' is only supported for deploy (got mode '${INPUT_MODE}' with command '${INPUT_COMMAND}')" >&2
          exit 1
        fi

        # Build the argv as an array — user-supplied values stay single words
        ARGS=("${INPUT_COMMAND}" "${INPUT_TARGET}")

        if [ -n "${INPUT_SERVICE}" ]; then
          if [ "${INPUT_COMMAND}" = "destroy" ]; then
            echo "Error: 'service' is not supported for destroy" >&2
            exit 1
          fi
          ARGS+=("${INPUT_SERVICE}")
        fi

        # Always non-interactive in CI
        ARGS+=(--non-interactive)

        # Skip confirmation for deploy/destroy (not applicable to build)
        if [ "${INPUT_COMMAND}" = "deploy" ] || [ "${INPUT_COMMAND}" = "destroy" ]; then
          ARGS+=(--skip-confirmation)
        fi

        if [ "${INPUT_COMMAND}" = "deploy" ]; then
          case "${INPUT_MODE}" in
            full) ;;
            infra-only) ARGS+=(--infra-only) ;;
            deploy-only) ARGS+=(--deploy-only) ;;
            *)
              echo "Error: unsupported mode '${INPUT_MODE}' (expected full, infra-only, or deploy-only)" >&2
              exit 1
              ;;
          esac

          if [ -n "${INPUT_ENVIRONMENT}" ]; then
            ARGS+=(-e "${INPUT_ENVIRONMENT}")
          fi

          if [ "${INPUT_SKIP_BUILD}" = "true" ]; then
            ARGS+=(--skip-build)
          fi

          if [ "${INPUT_SKIP_MIGRATIONS}" = "true" ]; then
            ARGS+=(--skip-migrations)
          fi

          if [ -n "${INPUT_REGION}" ]; then
            ARGS+=(--region "${INPUT_REGION}")
          fi

          if [ -n "${INPUT_IMAGE_TAG}" ]; then
            ARGS+=(--image-tag "${INPUT_IMAGE_TAG}")
          fi

          if [ "${INPUT_PLAN}" = "true" ]; then
            ARGS+=(--plan)
          fi

          if [ "${INPUT_REQUIRE_APPROVAL}" = "true" ]; then
            ARGS+=(--require-approval)
          fi

          if [ "${INPUT_AUTO_APPROVE}" = "true" ]; then
            ARGS+=(--auto-approve)
          fi

          if [ -n "${INPUT_APPROVAL_TOKEN}" ]; then
            ARGS+=(--approval-token "${INPUT_APPROVAL_TOKEN}")
          fi
        fi

        if [ "${INPUT_COMMAND}" = "deploy" ] || [ "${INPUT_COMMAND}" = "build" ]; then
          if [ -n "${INPUT_BUILD_ARGS}" ]; then
            while IFS= read -r build_arg; do
              if [ -n "${build_arg}" ]; then
                ARGS+=(--build-arg "${build_arg}")
              fi
            done <<< "${INPUT_BUILD_ARGS}"
          fi

          if [ -n "${INPUT_BUILD_SECRETS}" ]; then
            while IFS= read -r build_secret; do
              if [ -n "${build_secret}" ]; then
                ARGS+=(--build-secret "${build_secret}")
              fi
            done <<< "${INPUT_BUILD_SECRETS}"
          fi
        fi

        if [ "${INPUT_NO_CASCADE}" = "true" ]; then
          if [ "${INPUT_COMMAND}" = "deploy" ] || [ "${INPUT_COMMAND}" = "destroy" ]; then
            ARGS+=(--no-cascade)
          fi
        fi

        if [ "${INPUT_FORCE}" = "true" ]; then
          if [ "${INPUT_COMMAND}" = "deploy" ] || [ "${INPUT_COMMAND}" = "destroy" ]; then
            ARGS+=(--force)
          fi
        fi

        if [ "${INPUT_VERBOSE}" = "true" ]; then
          ARGS+=(--verbose)
        fi

        # Run with timing; tee output so the approval token can be captured
        LOG_FILE="$(mktemp)"
        START=$(date +%s)
        echo "::group::fjall ${ARGS[*]}"
        echo "Running: fjall ${ARGS[*]}"

        set +e
        fjall "${ARGS[@]}" 2>&1 | tee "${LOG_FILE}"
        EXIT_CODE=${PIPESTATUS[0]}
        set -e

        echo "::endgroup::"

        END=$(date +%s)
        echo "duration=$((END - START))" >> "${GITHUB_OUTPUT}"

        # The CLI prints "Approval token: <token>" when a plan has pending changes
        TOKEN_LINE=$(grep -m1 '^Approval token: ' "${LOG_FILE}" || true)
        rm -f "${LOG_FILE}"
        if [ -n "${TOKEN_LINE}" ]; then
          echo "approval-token=${TOKEN_LINE#Approval token: }" >> "${GITHUB_OUTPUT}"
        fi

        # Exit 2 = plan computed with changes pending approval, or refused at the
        # approval gate — no mutation happened. Propagate it so callers can gate.
        if [ "${EXIT_CODE}" -eq 0 ]; then
          echo "result=success" >> "${GITHUB_OUTPUT}"
        elif [ "${EXIT_CODE}" -eq 2 ]; then
          echo "result=plan-pending" >> "${GITHUB_OUTPUT}"
          exit 2
        else
          echo "result=failure" >> "${GITHUB_OUTPUT}"
          exit "${EXIT_CODE}"
        fi
